plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wacup.wake'
    compileSdk 35

    defaultConfig {
        applicationId "com.wacup.wake"
        minSdk 29          // Android 10 — covers the Galaxy A55
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload only: signed with the debug key so `assembleDebug`/`assembleRelease`
            // both produce an installable APK without a keystore setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No AndroidX / no external dependencies on purpose: builds offline and stays tiny.
dependencies {
}
