name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacup-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release with the APK
        if: github.ref_name == 'arena/8cc0a29a-wacup-mobile'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WACUP Mobile — latest build
          body: |
            Automatic build of `${{ github.sha }}` from `${{ github.ref_name }}`.
            Download the `.apk` below and open it on the phone to install.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
