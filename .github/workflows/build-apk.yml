name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK; the setup-android
      # action's extra download step is what kept failing.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true; fi
          echo "platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # The Actions log endpoint is not reachable from every environment, so a
      # failing build publishes its log as a release asset instead.
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failing build log
          body: Compiler output for `${{ github.sha }}`.
          files: build.log
          prerelease: true
          make_latest: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wacup-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release with the APK
        if: github.ref_name == 'arena/8cc0a29a-wacup-mobile'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WACUP Mobile — latest build
          body: |
            Automatic build of `${{ github.sha }}` from `${{ github.ref_name }}`.
            Download the `.apk` below and open it on the phone to install.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
