name: Build chip8bit (NES transcoder)

on:
  push:
    branches: ['**']
    paths:
      - 'tools/nes8bit/**'
      - '.github/workflows/build-chip8bit-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the window's one dependency
        working-directory: tools/nes8bit
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Pipeline self test
        working-directory: tools/nes8bit
        run: python tests/run_tests.py

      - name: Window self test (headless, clicks the chips, converts, plays)
        working-directory: tools/nes8bit
        run: |
          python tests/make_test_midi.py tests/genesis-style.mid
          python chip8bit.py --selftest --screenshot window.png
          ls -la window-*.png
          # the one look has to have rendered, and there is no second one any more
          test -f window-dark.png
          test ! -e window-win95.png && test ! -e window-amiga.png

      - name: Demo renders (all chips, and bare NES)
        working-directory: tools/nes8bit
        run: |
          mkdir -p demo
          python chip8bit.py --cli tests/genesis-style.mid --extensions all --stats
          python chip8bit.py --cli tests/genesis-style.mid
          # asset names on a release must stay boring: no spaces or brackets
          cp "tests/genesis-style [nes+dual+pce+vrc6+mmc5+fds+n163+psg+dmc].wav" \
             demo/demo-all-chips.wav
          cp "tests/genesis-style [nes].wav" demo/demo-bare-nes.wav
          # a fast one: 226 BPM sixteenths, which used to be dropped as "too short"
          python -c "from nescore.demo import write_fast; write_fast('tests/fast-tune.mid')"
          python chip8bit.py --cli tests/fast-tune.mid --extensions all
          cp "tests/fast-tune [nes+dual+pce+vrc6+mmc5+fds+n163+psg+dmc].wav" \
             demo/demo-fast-tune.wav
          # and the same tune on the two whole consoles, in stereo, because that
          # is the one render you can only hear with a second APU and a PC Engine
          python chip8bit.py --cli tests/genesis-style.mid --extensions dual,pce --stereo
          cp "tests/genesis-style [nes+dual+pce].wav" demo/demo-2x-nes-pc-engine.wav
          # the NES switched off: a PC Engine on its own is six voices, not a
          # NES with six extras, and its file is named [pce] not [nes+pce]
          python chip8bit.py --cli tests/genesis-style.mid --no-nes --extensions pce --stereo
          cp "tests/genesis-style [pce].wav" demo/demo-pce-only.wav
          ls -la demo

      # Artifacts keep the folder layout of what they upload, and the release job
      # needs a flat folder, so stage the files one level deep and upload the glob.
      - name: Stage the demo assets
        working-directory: tools/nes8bit
        run: |
          mkdir -p release_assets
          cp demo/demo-all-chips.wav demo/demo-bare-nes.wav demo/demo-fast-tune.wav \
             demo/demo-2x-nes-pc-engine.wav demo/demo-pce-only.wav release_assets/
          cp window-dark.png release_assets/
          ls -la release_assets

      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-demo
          path: tools/nes8bit/release_assets/*
          if-no-files-found: error

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/nes8bit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      # Two builds from one source: the window everyone double-clicks, and a
      # console build for scripts and batch conversion.
      - name: Build chip8bit.exe (app window)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name chip8bit --clean `
            --hidden-import nescore.importers.midi `
            --hidden-import nescore.importers.vgm `
            --hidden-import nescore.importers.gym `
            --hidden-import nescore.importers.ds `
            --hidden-import nescore.app `
            chip8bit.py 2>&1 | Tee-Object -FilePath build.log

      - name: Build chip8bit-cli.exe (console)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --console --name chip8bit-cli --clean `
            --hidden-import nescore.importers.midi `
            --hidden-import nescore.importers.vgm `
            --hidden-import nescore.importers.gym `
            --hidden-import nescore.importers.ds `
            chip8bit.py 2>&1 | Tee-Object -FilePath build-cli.log

      - name: Smoke test both executables
        shell: pwsh
        run: |
          python tests/make_test_midi.py tests/genesis-style.mid

          # the windowed build, headless: it must open, convert the demo tune and
          # write a screenshot, or the exit code fails the build
          $gui = Start-Process -FilePath ".\dist\chip8bit.exe" `
            -ArgumentList "--selftest", "--screenshot", "window.png" -Wait -PassThru -NoNewWindow
          "window selftest exit: $($gui.ExitCode)"
          Get-ChildItem .\window-*.png | Format-Table Name, Length
          if ($gui.ExitCode -ne 0) { throw "chip8bit.exe --selftest exited $($gui.ExitCode)" }
          if (-not (Test-Path .\window-dark.png)) { throw "the window never drew a frame" }
          if (Test-Path .\window-win95.png) { throw "the retired Windows 95 look is back" }

          # the console build still does the classic command line job
          $out = & ".\dist\chip8bit-cli.exe" --cli tests\genesis-style.mid --extensions all --stats 2>&1 | Out-String
          $out | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) { throw "chip8bit-cli.exe exited $LASTEXITCODE" }
          if (-not $out.Contains("notes placed")) { throw "no arrangement stats in the output" }
          Get-ChildItem tests\*.wav | Format-Table Name, Length
          Get-ChildItem dist | Format-Table Name, Length

      # Actions logs redirect to hosts that are sometimes unreachable, so a
      # failing build commits its own log into the branch instead.
      - name: Commit build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          for file in tools/nes8bit/build.log tools/nes8bit/build-cli.log \
                      tools/nes8bit/smoke.log; do
            echo "=== $file" >> ci/chip8bit-last-failure.log
            cat "$file" >> ci/chip8bit-last-failure.log 2>/dev/null || true
          done
          git config user.name "wacup-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/chip8bit-last-failure.log
          git commit -m "ci: chip8bit log from ${{ github.sha }} [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Stage the release assets
        shell: bash
        run: |
          mkdir -p release_assets
          cp dist/chip8bit.exe dist/chip8bit-cli.exe release_assets/
          ls -la release_assets

      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-windows
          path: tools/nes8bit/release_assets/*
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref_name == 'arena/8cc0a29a-wacup-mobile'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-demo
          path: dist
      - name: Show release assets
        run: ls -la dist

      # The release action leaves same-named assets in place, which means a new
      # build silently sits behind yesterday's binaries. Drop the release first.
      - name: Remove the old release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # the release job has no checkout, so gh needs the repo spelled out
          if gh release view chip8bit-latest >/dev/null 2>&1; then
            gh release delete chip8bit-latest --cleanup-tag --yes
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chip8bit-latest
          name: chip8bit — NES / 8-bit transcoder
          body: |
            Automatic build of `${{ github.sha }}`.

            **`chip8bit.exe` is the app.** Double-click it and its own window opens —
            no browser, no server, no install. Drag music onto the window or press
            *Add files…*, click the extension chips you want, press Convert, then
            play the result and save it wherever you like. Files dropped onto the
            exe open the window with them already queued.

            `chip8bit-cli.exe` is the same engine for scripts:

            ```
            chip8bit-cli.exe --cli song.mid --extensions all --stats
            chip8bit-cli.exe --cli game.vgz -o converted
            chip8bit-cli.exe --cli --list-songs rom.nds
            chip8bit-cli.exe --cli rom.nds --sequence "BGM_BOSS" --stats
            ```

            **Nintendo DS ROMs work too.** Drop a `.nds` (or a `.sdat`, or a bare
            `.sseq`) on the window: the sequence is read out of the archive and
            converted like any other tune, and two files are written next to the
            `.wav` — `<song>.mid`, the sequence as a real Standard MIDI File, and
            `<song>.sf2`, the bank's instruments and samples as a real SoundFont.
            Nothing is bundled or downloaded; every byte comes out of your ROM.

            A whole soundtrack is one command, on the bare NES (the default — no
            chips to switch on):

            ```
            chip8bit-cli.exe --cli game.nds --all-songs --wav-only -o "8-bit"
            ```

            One `<rom> <song> [nes].wav` per song, named the way the game named it,
            with no `.mid`/`.sf2` clutter. Drums are found in the bank too: the
            instrument with one wave per key is the kit, so percussion lands on the
            noise channel as kick/snare/hat instead of being mistaken for a bass
            line and played on the triangle.

            **A second NES and a PC Engine.** Two of the switches are not cartridge
            chips but whole other consoles playing along: `2x NES` doubles the APU
            (4 → 8 voices), and `PC Engine` adds Hudson's HuC6280 — six channels,
            each with its own 32-step waveform in RAM, 5-bit volume and stereo pan.
            The converter loads a different wave per instrument, so a flute, a
            string bed and an organ are three different waveforms instead of three
            squares, and a line with a real timbre gets those channels first. Both
            go into the VGM log too (dual-APU bit and the HuC6280 command).

            **One note per voice, always.** A chip channel is monophonic, so the
            arranger now keeps every placed note in a sorted interval list and asks
            it directly whether a channel is busy at a given moment. Two notes can
            therefore never land on one voice — not a chord on top of a bar of
            melody, and not a note placed for a moment *before* one already placed
            (which is exactly what used to happen, and what made a conversion sound
            like it was "sharing channels"). A kick also no longer swallows the bass
            note on its own MIDI pitch, and the triangle stays with the bass line
            instead of being taken by a chord tone for half a beat.

            **A chip never takes music away.** Switching on a second APU or a PC
            Engine can only ever give you more notes, never fewer: the old "thin
            the mix" cap that deleted whole harmony and drum lines from eight
            voices up is gone, so the notes-kept count only goes up as you add
            chips. A line is left out only when no voice is free at that moment,
            and every one of those is counted and reported.

            Sound: drums are real samples through the delta channel, every note has
            an attack/release so nothing clicks, and the mix is balanced by role —
            melody on top, bass under it, the chord bed underneath, drums in front
            of the bed. Nothing is crammed in as an arpeggio.

            `demo-*.wav` are the built-in test tune on the bare NES, on the console
            with every extension chip enabled, on two NES APUs plus a PC Engine, and
            on a PC Engine **with the NES switched off** (`--no-nes --extensions pce`):
            six PC Engine voices and nothing else. `window-dark.png` is a real
            screenshot of the window: one flat dark tracker desk, channel meters for
            every voice, a toolbar instead of a button grid, and the pattern page with
            note / instrument / volume in hex and row numbers every four channels. The
            three skins are gone — there is one look, it is dark, and nothing switches
            it. Frames are also cheap now: the pattern rows and the meters are painted
            once and kept, and the window only repaints when something changed, so a
            three-minute tune that used to sit at 19 ms a frame stays under 5 ms with
            no spikes.
          files: |
            dist/chip8bit.exe
            dist/chip8bit-cli.exe
            dist/*.wav
            dist/window-*.png
          prerelease: true
          make_latest: false

      # and prove the download really is this build, not a stale asset
      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          for name in chip8bit.exe chip8bit-cli.exe window-dark.png \
                      demo-all-chips.wav demo-bare-nes.wav demo-fast-tune.wav \
                      demo-2x-nes-pc-engine.wav demo-pce-only.wav; do
            size=$(gh release view chip8bit-latest --json assets \
              --jq ".assets[] | select(.name==\"$name\") | .size")
            if [ -z "$size" ]; then
              echo "missing asset: $name"; exit 1
            fi
            echo "$name: $size bytes"
          done
          wav=$(gh release view chip8bit-latest --json assets \
            --jq '.assets[] | select(.name=="demo-all-chips.wav") | .size')
          if [ "$wav" -lt 500000 ]; then
            echo "the demo wav is the old 8-bit file; the release did not refresh"
            exit 1
          fi
