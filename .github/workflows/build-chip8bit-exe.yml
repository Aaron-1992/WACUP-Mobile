name: Build chip8bit (NES transcoder)

on:
  push:
    branches: ['**']
    paths:
      - 'tools/nes8bit/**'
      - '.github/workflows/build-chip8bit-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pipeline self test
        working-directory: tools/nes8bit
        run: python tests/run_tests.py

      - name: GUI self test (starts the window server and drives it over HTTP)
        working-directory: tools/nes8bit
        run: python chip8bit.py --selftest

      - name: Demo renders (all chips, and bare NES)
        working-directory: tools/nes8bit
        run: |
          mkdir -p demo
          python tests/make_test_midi.py tests/genesis-style.mid
          python chip8bit.py tests/genesis-style.mid --extensions all --stats
          python chip8bit.py tests/genesis-style.mid
          # asset names on a release must stay boring: no spaces or brackets
          cp "tests/genesis-style [nes+vrc6+mmc5+fds+n163+psg+dmc].wav" demo/demo-all-chips.wav
          cp "tests/genesis-style [nes].wav" demo/demo-bare-nes.wav
          ls -la demo

      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-demo
          path: tools/nes8bit/demo/*.wav
          if-no-files-found: error

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/nes8bit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # Two builds from one source: the window everyone double-clicks, and a
      # console build for scripts and batch conversion.
      - name: Build chip8bit.exe (GUI window)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name chip8bit --clean `
            --hidden-import nescore.importers.midi `
            --hidden-import nescore.importers.vgm `
            --hidden-import nescore.importers.gym `
            chip8bit.py 2>&1 | Tee-Object -FilePath build.log

      - name: Build chip8bit-cli.exe (console)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --console --name chip8bit-cli --clean `
            --hidden-import nescore.importers.midi `
            --hidden-import nescore.importers.vgm `
            --hidden-import nescore.importers.gym `
            chip8bit.py 2>&1 | Tee-Object -FilePath build-cli.log

      - name: Smoke test both executables
        shell: pwsh
        run: |
          python tests/make_test_midi.py tests/genesis-style.mid

          # the windowed GUI build: a headless run that starts the window server,
          # converts the demo tune and quits (exit code is the verdict)
          $gui = Start-Process -FilePath ".\dist\chip8bit.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          "gui selftest exit: $($gui.ExitCode)"
          if (Test-Path .\dist\chip8bit.log) { Get-Content .\dist\chip8bit.log }
          if ($gui.ExitCode -ne 0) { throw "chip8bit.exe --selftest exited $($gui.ExitCode)" }

          # the console build still has to do the classic command line job
          $out = & ".\dist\chip8bit-cli.exe" tests\genesis-style.mid --extensions all --stats 2>&1 | Out-String
          $out | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) { throw "chip8bit-cli.exe exited $LASTEXITCODE" }
          if (-not $out.Contains("notes placed")) { throw "no arrangement stats in the output" }
          $wavs = Get-ChildItem tests\*.wav
          if ($wavs.Count -lt 1) { throw "no wav written" }
          $wavs | Format-Table Name, Length
          Get-ChildItem dist | Format-Table Name, Length

      # Actions logs redirect to hosts that are sometimes unreachable, so a
      # failing build commits its own log into the branch instead.
      - name: Commit build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          for file in tools/nes8bit/build.log tools/nes8bit/build-cli.log \
                      tools/nes8bit/smoke.log tools/nes8bit/dist/chip8bit.log; do
            echo "=== $file" >> ci/chip8bit-last-failure.log
            cat "$file" >> ci/chip8bit-last-failure.log 2>/dev/null || true
          done
          git config user.name "wacup-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/chip8bit-last-failure.log
          git commit -m "ci: chip8bit log from ${{ github.sha }} [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-windows
          path: |
            tools/nes8bit/dist/chip8bit.exe
            tools/nes8bit/dist/chip8bit-cli.exe
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref_name == 'arena/8cc0a29a-wacup-mobile'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-demo
          path: dist
      - name: Show release assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chip8bit-latest
          name: chip8bit — NES / 8-bit transcoder
          body: |
            Automatic build of `${{ github.sha }}`.

            **`chip8bit.exe` is the app.** Double-click it: a window opens in your
            browser with drag-and-drop, chip toggles, a player for the result and a
            download button. Drop a `.mid`, `.vgm`, `.vgz`, `.gym` or `.zip` onto it
            and the file is already queued when the window opens.

            `chip8bit-cli.exe` is the same tool for scripts:

            ```
            chip8bit-cli.exe song.mid --extensions all --stats
            chip8bit-cli.exe game.vgz --extensions vrc6,mmc5,fds
            chip8bit-cli.exe --list-extensions
            ```

            The `demo-*.wav` files are the built-in test tune on the bare NES and on
            the console with every extension chip enabled.
          files: |
            dist/chip8bit.exe
            dist/chip8bit-cli.exe
            dist/*.wav
          prerelease: true
          make_latest: false
