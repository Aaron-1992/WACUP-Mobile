name: Build chip8bit (NES transcoder)

on:
  push:
    branches: ['**']
    paths:
      - 'tools/nes8bit/**'
      - '.github/workflows/build-chip8bit-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self test
        working-directory: tools/nes8bit
        run: |
          python tests/make_test_midi.py tests/genesis-style.mid
          python tests/run_tests.py
      - name: Demo renders (all chips, and bare NES)
        working-directory: tools/nes8bit
        run: |
          mkdir -p demo
          python chip8bit.py tests/genesis-style.mid --extensions all --stats
          python chip8bit.py tests/genesis-style.mid
          # asset names on a release must stay boring: no spaces or brackets
          cp "tests/genesis-style [nes+vrc6+mmc5+fds+n163+psg+dmc].wav" demo/demo-all-chips.wav
          cp "tests/genesis-style [nes].wav" demo/demo-bare-nes.wav
          ls -la demo
      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-demo
          path: tools/nes8bit/demo/*.wav
          if-no-files-found: error

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build chip8bit.exe
        working-directory: tools/nes8bit
        shell: pwsh
        run: |
          # frozen executables cannot follow imports-by-string, so name them
          python -m PyInstaller --onefile --name chip8bit --console --clean `
            --hidden-import nescore.importers.midi `
            --hidden-import nescore.importers.vgm `
            --hidden-import nescore.importers.gym `
            chip8bit.py 2>&1 | Tee-Object -FilePath build.log
      - name: Smoke test the exe
        working-directory: tools/nes8bit
        shell: pwsh
        run: |
          python tests/make_test_midi.py tests/genesis-style.mid
          $exe = ".\dist\chip8bit.exe"
          $out = & $exe --list-extensions 2>&1 | Out-String
          $out | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) { throw "list-extensions exited $LASTEXITCODE" }
          $out = & $exe tests\genesis-style.mid --extensions all --stats 2>&1 | Out-String
          $out | Tee-Object -FilePath smoke.log -Append
          if ($LASTEXITCODE -ne 0) { throw "conversion exited $LASTEXITCODE" }
          if (-not $out.Contains("notes")) { throw "no arrangement stats in the output" }
          $wavs = Get-ChildItem tests\*.wav
          if ($wavs.Count -lt 1) { throw "no wav written" }
          $wavs | Format-Table Name, Length

      # Actions logs redirect to hosts that are sometimes unreachable, so a
      # failing build commits its own log into the branch instead.
      - name: Commit build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          cat tools/nes8bit/build.log tools/nes8bit/smoke.log >> ci/chip8bit-last-failure.log 2>/dev/null || true
          git config user.name "wacup-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/chip8bit-last-failure.log
          git commit -m "ci: chip8bit log from ${{ github.sha }} [skip ci]" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
      - uses: actions/upload-artifact@v4
        with:
          name: chip8bit-windows
          path: tools/nes8bit/dist/chip8bit.exe
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref_name == 'arena/8cc0a29a-wacup-mobile'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: chip8bit-demo
          path: dist
      - name: Show release assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chip8bit-latest
          name: chip8bit — NES / 8-bit transcoder
          body: |
            Automatic build of `${{ github.sha }}`.

            **Download `chip8bit.exe`** and run it from a command prompt:

            ```
            chip8bit.exe song.mid --extensions all --stats
            chip8bit.exe game.vgz --extensions vrc6,mmc5,fds
            chip8bit.exe --list-extensions
            ```

            The `demo-*.wav` files are the same test tune rendered on the bare NES
            and on the console with every extension chip enabled, so you can hear
            what the extra channels buy you before converting your own music.
          files: |
            dist/chip8bit.exe
            dist/*.wav
          prerelease: true
          make_latest: false
